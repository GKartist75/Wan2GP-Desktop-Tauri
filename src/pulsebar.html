<!doctype html>
<html lang="en" style="background:#111">
<head>
<meta charset="utf-8">
<title>Wan2GP Progress</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { background: #111; }
  .pb-wrap { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 8px 12px; background: #111; }
  .pb-top { display: flex; align-items: center; gap: 8px; }
  .pb-label { flex: 1; font-size: 11px; color: #9ae6b4; font-family: Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pb-err { color: #f87171 !important; }
  .pb-close { background: none; border: none; color: #666; cursor: pointer; font-size: 12px; padding: 0 2px; }
  .pb-close:hover { color: #eee; }
  .pb-track { height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
  .pb-fill { height: 100%; width: 0%; background: #9ae6b4; border-radius: 3px; transition: width 0.4s; }
</style>
</head>
<body style="background:#111">
<div class="pb-wrap" data-tauri-drag-region>
  <div class="pb-top" data-tauri-drag-region>
    <span class="pb-label" id="pbLabel">Wan2GP idle</span>
    <button class="pb-close" id="pbClose" title="Close">✕</button>
  </div>
  <div class="pb-track"><div class="pb-fill" id="pbFill"></div></div>
</div>
<script>
"use strict";
var fails = 0;
async function tick() {
  var label = document.getElementById("pbLabel");
  try {
    if (!window.__TAURI__ || !window.__TAURI__.core) throw new Error("bridge missing");
    var s = await window.__TAURI__.core.invoke("pulsebar_state");
    fails = 0;
    label.classList.remove("pb-err");
    label.textContent = (s && s.label) || "Wan2GP idle";
    document.getElementById("pbFill").style.width = ((s && s.pct != null) ? s.pct : 0) + "%";
  } catch (e) {
    fails++;
    if (fails > 3) { label.classList.add("pb-err"); label.textContent = "No backend link (" + e + ")"; }
  }
}
document.getElementById("pbClose").addEventListener("click", function() {
  try { window.__TAURI__.core.invoke("pulsebar_hide"); } catch (e) { window.close(); }
});
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
