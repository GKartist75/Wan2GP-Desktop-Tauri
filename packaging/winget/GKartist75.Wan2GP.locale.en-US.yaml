ShortDescription: One-click desktop launcher for WanGP (Wan2GP).
Description: >-
  A lightweight Tauri shell for WanGP (Wan2GP): detects the GPU, installs the
  right Python environment and kernel wheels, launches the WanGP web UI in an
  embedded desktop view, and keeps models, outputs and updates in one place.
  Installing the launcher does not download models or Python packages; the
  first-run installer screen does that after you pick folders.
